version: "3.9"

services:
  backend:
    build: ./backend
    container_name: smart-parking-backend
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./parking.db
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/parking_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: smart-parking-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
