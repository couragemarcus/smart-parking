version: "3.9"

services:
  backend:
    build: ./backend
    container_name: smart-parking-backend-prod
    env_file: .env.prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://parking:${POSTGRES_PASSWORD}@db:5432/parking
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=https://${DOMAIN}/api
    container_name: smart-parking-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: smart-parking-db
    environment:
      - POSTGRES_DB=parking
      - POSTGRES_USER=parking
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
